# CI/CD for rakshithponnappa.dev. See docs/PIPELINE.md.
#   every push and PR: build once → unit, AI, content, ops, E2E/a11y/CSP suites + gitleaks
#   main only:         deploy that exact build → live smoke test → automatic rollback if the smoke test fails
# Lighthouse and visual regression run only on manual dispatch. Test details: docs/TESTING.md.
name: CI/CD

on:
  # Branches are tested through their pull request; pushes to main test and deploy.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      lighthouse:
        description: Run Lighthouse + perf budgets (npm run test:perf)
        type: boolean
        default: false
      visual:
        description: Run visual regression (npm run test:visual)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  # Every QA suite (vitest tests/** and Playwright) reads the build from here.
  QA_BUILD_DIR: .build-qa
  WRANGLER_SEND_METRICS: 'false'
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build (the artifact that gets tested is the one that gets deployed)
        id: build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          # Deploy history lives on the site itself; merge it in so /status/ keeps its past entries.
          node scripts/status-record.mjs --pull https://rakshithponnappa.dev/status-history.json || true
          npm run build
          npm run status:record
          npm run pdf
          rm -rf "$QA_BUILD_DIR" && cp -R dist "$QA_BUILD_DIR"

      - name: Unit tests (src + worker)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=test-results/junit-unit.xml

      - name: AI suite (retrieval gate, adversarial, crawler view)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:ai
        env:
          QA_JUNIT: test-results/junit-ai.xml

      - name: Content guard
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:content
        env:
          QA_JUNIT: test-results/junit-content.xml

      - name: Ops suite (wrangler config, _headers, deploy dry-run, wrangler dev stack)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:ops
        env:
          QA_JUNIT: test-results/junit-ops.xml

      - name: Install Playwright browsers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # test:e2e currently lists every engine itself, so `-- --project=chromium` adds to that list rather than
        # narrowing it (docs/TEST-REPORT.md, X-1). Install all three until test:e2e accepts a project filter.
        run: npx playwright install --with-deps chromium firefox webkit

      - name: E2E (Playwright, chromium)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:e2e -- --project=chromium

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload site build for deploy
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: dist/
          retention-days: 7

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: tests/ops/gitleaks.toml

  deploy:
    name: deploy (production)
    needs: [test, gitleaks]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://rakshithponnappa.dev
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check deploy credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID variable (docs/PIPELINE.md)."
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: dist/

      - name: Remember the live version (rollback target)
        id: prev
        run: |
          v=$(npx wrangler deployments list --json | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8"));const last=d.at(-1);process.stdout.write(last?.versions?.[0]?.version_id??"")')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Live version before deploy: ${v:-none}"

      - name: Deploy site + API Worker
        run: npx wrangler deploy --message "ci ${GITHUB_SHA::7}"

      - name: Deploy www → apex redirect Worker
        run: npx wrangler deploy -c worker/www-redirect/wrangler.jsonc

      - name: Smoke test the live site
        id: smoke
        run: node scripts/smoke.mjs https://rakshithponnappa.dev --sha "$GITHUB_SHA"

      - name: Roll back to the previous version
        if: ${{ failure() && steps.smoke.outcome == 'failure' && steps.prev.outputs.version != '' }}
        run: |
          npx wrangler rollback "${{ steps.prev.outputs.version }}" --message "auto-rollback: smoke test failed for ${GITHUB_SHA::7}" --yes
          echo "### Rolled back to ${{ steps.prev.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          node scripts/smoke.mjs https://rakshithponnappa.dev

  extra:
    # Opt-in only: Lighthouse/perf budgets and visual regression are slow and environment-sensitive.
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.lighthouse || inputs.visual) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: |
          npm run build
          rm -rf "$QA_BUILD_DIR" && cp -R dist "$QA_BUILD_DIR"
      - run: npx playwright install --with-deps chromium
      - name: Lighthouse + perf budgets
        if: ${{ inputs.lighthouse }}
        run: npm run test:perf
      - name: Visual regression
        if: ${{ !cancelled() && inputs.visual }}
        run: npm run test:visual
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: extra-reports
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
