# Synthetic monitoring: smoke-test the live site every 6 hours. A failure opens (or comments on) one
# "live-incident" issue; the next passing run closes it. See docs/PIPELINE.md.
name: Live monitor

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: live-monitor
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Smoke test https://rakshithponnappa.com
        id: smoke
        continue-on-error: true
        run: node scripts/smoke.mjs https://rakshithponnappa.com | tee smoke.txt

      - name: Open or update the incident issue
        if: ${{ steps.smoke.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create live-incident --color B60205 --description "Live smoke test failing" 2>/dev/null || true
          body=$(printf 'Live smoke test failed: %s\n\n```\n%s\n```' "$RUN_URL" "$(cat smoke.txt)")
          n=$(gh issue list --label live-incident --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "Live site smoke test failing" --label live-incident --body "$body"; fi
          exit 1

      - name: Close the incident issue on recovery
        if: ${{ steps.smoke.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label live-incident --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Recovered: smoke test passing again (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          done
